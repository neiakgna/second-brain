<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="'Cascadia Code', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="20" y="14" width="720" height="352" rx="12" fill="#1e1e2e" filter="url(#shadow)"/>
  <path d="M20,50 L20,26 Q20,14 32,14 L728,14 Q740,14 740,26 L740,50 Z" fill="#313244"/>
  <circle cx="44" cy="32" r="6" fill="#f38ba8"/>
  <circle cx="66" cy="32" r="6" fill="#f9e2af"/>
  <circle cx="88" cy="32" r="6" fill="#a6e3a1"/>
  <text x="380" y="37" text-anchor="middle" font-size="12.5" fill="#7f849c">second-brain</text>
  <g font-size="14" xml:space="preserve">
    <text x="44" y="82"><tspan fill="#74c7ec">~/second-brain</tspan><tspan fill="#a6e3a1"> $ </tspan><tspan fill="#cdd6f4">sb stats</tspan></text>
    <text x="44" y="103" fill="#a6adc8">3 chunk(s) stored in second_brain.db.</text>
    <text x="44" y="145"><tspan fill="#74c7ec">~/second-brain</tspan><tspan fill="#a6e3a1"> $ </tspan><tspan fill="#cdd6f4">sb search </tspan><tspan fill="#f9e2af">"why did we choose fastembed"</tspan></text>
    <text x="44" y="166"><tspan fill="#f9e2af">1.</tspan><tspan fill="#89b4fa"> docs/adr/0001-embedding-library.md</tspan><tspan fill="#6c7086">   (distance 1.122)</tspan></text>
    <text x="44" y="187" fill="#a6adc8">   The embedding model is accessed via a small EmbeddingBackend</text>
    <text x="44" y="208" fill="#a6adc8">   protocol, so the library can be swapped without touching the rest.</text>
    <text x="44" y="250"><tspan fill="#f9e2af">2.</tspan><tspan fill="#89b4fa"> docs/architecture.md</tspan><tspan fill="#6c7086">   (distance 1.216)</tspan></text>
    <text x="44" y="271" fill="#a6adc8">   second-brain is a local-first knowledge system. All data and</text>
    <text x="44" y="292" fill="#a6adc8">   computation stay on your own machine.</text>
    <text x="44" y="334"><tspan fill="#74c7ec">~/second-brain</tspan><tspan fill="#a6e3a1"> $ </tspan><tspan fill="#cdd6f4">█<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
